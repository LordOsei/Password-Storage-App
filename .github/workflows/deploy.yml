name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The app reads KEY_VAULT_URL at import time; tests mock the client, so any URL works.
      - run: pytest
        env:
          KEY_VAULT_URL: https://test-vault.vault.azure.net/

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pwstore-app-254439.azurewebsites.net
    permissions:
      contents: read
      id-token: write # OIDC login to Azure; no stored credentials
    steps:
      - uses: actions/checkout@v4

      # Ship only what the app needs; App Service installs requirements.txt during deploy
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true).
      - run: zip -r app.zip app requirements.txt -x '*/__pycache__/*'

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: pwstore-app-254439
          package: app.zip
