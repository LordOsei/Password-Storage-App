<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Password Store{% endblock %} · Password Store</title>
  <meta name="description" content="Private password manager for our group. Sign in with your Microsoft account.">
  <meta name="theme-color" content="#0071e3">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1><a href="/">Password Store</a></h1>
    {% if user %}
    <div class="account">
      <span class="user">{{ user }}</span>
      {% if auth_mode() == "header" %}<a class="sign-out" href="/.auth/logout?post_logout_redirect_uri=/welcome">Sign out</a>{% endif %}
    </div>
    {% endif %}
  </header>
  <main>
    {% if errors %}
    <div class="errors" role="alert">
      <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
